[build-system]
requires = ['setuptools']
build-backend = 'setuptools.build_meta'

[project]
name = "hhfloppy"
version = "1.1.17"
description = "Tools for working with floppies via Pauline"
authors = [
    { name = "Sanqui", email = "me@sanqui.net" },
    { name = "Starfooty", email = "me@kalanys.com" },
]
requires-python = ">=3.9"
readme = "README.md"
classifiers = [
    'Development Status :: 5 - Production/Stable',
    'Intended Audience :: Science/Research',
    'Intended Audience :: Developers',
    'Programming Language :: Python',
    'Programming Language :: Python :: 3',
    'Topic :: System :: Archiving',
    'Topic :: System :: Hardware',
    'Typing :: Typed',
]
dependencies = [
    "asyncssh>=2.19.0",
    "blake3>=1.0.0",
    "click>=8.0.0",
    "jinja2>=3.1.0",
    "msgspec>=0.19.0",
    "requests-oauthlib>=2.0.0",
    "tqdm>=4.67.1",
    "typer>=0.20.0",
    "websockets>=14.2",
]

[project.optional-dependencies]
test = [
    'pytest',
]
dev = [
    'pytest',
]

[tool.setuptools.packages.find]
where = ["src"]
